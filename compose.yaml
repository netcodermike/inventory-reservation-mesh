services:
  orders:
    build: ./services/orders
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      OPERATION_PATH: /reserve
      UPSTREAM_URL: http://stock:8081/hold
    depends_on:
      stock:
        condition: service_healthy
  stock:
    build: ./services/stock
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/health', timeout=1).close()"]
      interval: 1s
      timeout: 2s
      retries: 20
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      OPERATION_PATH: /hold
      DB_PATH: /data/demo.sqlite3
    volumes:
      - service-data:/data

volumes:
  service-data:
